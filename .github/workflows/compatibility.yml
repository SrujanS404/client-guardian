name: Legacy Client Compatibility

on:
  pull_request:
  push:
    branches: [main]

jobs:
  compatibility:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install
      - name: Start demo backend
        run: |
          npm run start:api > api.log 2>&1 &
          for i in {1..30}; do
            if curl --silent --fail http://127.0.0.1:4000/health; then exit 0; fi
            sleep 1
          done
          cat api.log
          exit 1
      - name: Replay legacy client requests
        run: npm run test:guardian
      - name: Upload compatibility report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: client-guardian-report
          path: reports/latest-report.json
          if-no-files-found: ignore
